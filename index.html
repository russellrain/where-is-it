<!doctype html>
<html lang="en" data-quiz-lang>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where Is It · The place-finding game</title>
  <meta name="description" content="Find countries, U.S. states, capitals and counties on the map. You get one place at a time and three guesses, then see your score and time. Free, no sign-up.">
  <link rel="canonical" href="https://whereisit.earth/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Where Is It">
  <meta property="og:url" content="https://whereisit.earth/">
  <meta property="og:title" content="Where Is It · The place-finding game">
  <meta property="og:description" content="Find countries, U.S. states, capitals and counties on the map. You get one place at a time and three guesses, then see your score and time. Free, no sign-up.">
  <meta property="og:image" content="https://whereisit.earth/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A world map with some countries colored in, and the Where Is It logo">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Where Is It",
    "alternateName": "The place-finding game",
    "url": "https://whereisit.earth/",
    "description": "Find countries, U.S. states, capitals and counties on the map. You get one place at a time and three guesses, then see your score and time. Free, no sign-up.",
    "applicationCategory": "EducationalApplication",
    "genre": "Geography quiz",
    "operatingSystem": "Any (web browser)",
    "isAccessibleForFree": true,
    "inLanguage": ["en", "es", "fr", "pt"],
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "image": "https://whereisit.earth/assets/og-image.png"
  }
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-4 0 32 32'><path fill='%23e0483e' d='M12 0C5.37 0 0 5.37 0 12c0 8.4 10.2 18.6 11.2 19.6a1.1 1.1 0 0 0 1.6 0C13.8 30.6 24 20.4 24 12 24 5.37 18.63 0 12 0z'/><circle cx='12' cy='12' r='4.6' fill='white'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
  <script src="js/i18n.js"></script>
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="game">
    <div class="topbar">
      <a class="wordmark top-home" id="top-home" href="./" title="Where Is It — home" aria-label="Where Is It — home" hidden><span class="wm-name"><span class="wm-text">Where Is It</span><svg class="pin" viewBox="0 0 24 32" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 8.4 10.2 18.6 11.2 19.6a1.1 1.1 0 0 0 1.6 0C13.8 30.6 24 20.4 24 12 24 5.37 18.63 0 12 0z"/><circle cx="12" cy="12" r="4.6"/></svg></span></a>
      <button type="button" class="icon-btn" id="home" title="Back to quiz start" aria-label="Back to quiz start" data-i18n-title="backToStart" data-i18n-aria-label="backToStart" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="prompt">
        <div>
          <div class="label" id="prompt-label"></div>
          <div class="target" id="target"><a class="wordmark" href="./" aria-label="Where Is It — home"><span class="wm-name">Where Is It<svg class="pin" viewBox="0 0 24 32" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 8.4 10.2 18.6 11.2 19.6a1.1 1.1 0 0 0 1.6 0C13.8 30.6 24 20.4 24 12 24 5.37 18.63 0 12 0z"/><circle cx="12" cy="12" r="4.6"/></svg></span></a></div>
        </div>
        <div class="guesses" id="guesses" title="Guesses left" data-i18n-title="guessesLeftTitle"></div>
      </div>
      <div class="stats idle">
        <div class="stat"><b id="stat-progress">–</b><small data-i18n="statCountry">Country</small></div>
        <div class="stat"><b id="stat-score">0</b><small data-i18n="statCorrect">Correct</small></div>
        <div class="stat"><b id="stat-time">0:00</b><small data-i18n="statTime">Time</small></div>
      </div>
      <select class="lang-select" aria-label="Language" hidden></select>
      <button type="button" class="icon-btn theme-toggle" aria-label="Switch theme"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="currentColor"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="map-wrap" id="map">
      <div class="feedback" id="feedback" hidden></div>
      <div class="sr-only" id="sr-status" role="status" aria-live="polite"></div>
      <div class="zoom-controls">
        <button type="button" id="zoom-in" title="Zoom in" aria-label="Zoom in" data-i18n-title="zoomIn" data-i18n-aria-label="zoomIn">+</button>
        <button type="button" id="zoom-out" title="Zoom out" aria-label="Zoom out" data-i18n-title="zoomOut" data-i18n-aria-label="zoomOut">−</button>
        <button type="button" id="zoom-reset" title="Zoom to the quiz countries" aria-label="Zoom to the quiz countries" data-i18n-title="zoomToFit" data-i18n-aria-label="zoomToFit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </div>
      <button type="button" class="btn primary show-results" id="show-results" data-i18n="showResults" hidden>Show results</button>
      <div class="overlay" id="overlay"><div class="card" id="card"><noscript>
        <h1>Where Is It: the place-finding game</h1>
        <p>A free geography game. Find countries, U.S. states, state capitals and counties on the map, one at a time. Build your own quiz and share it with a link. No accounts, no sign-ups.</p>
        <p><strong>Where Is It needs JavaScript to run.</strong> Turn it on in your browser to play.</p>
        <ul>
          <li><a href="?c=all">All countries of the world</a></li>
          <li><a href="?m=us&amp;c=all">All 50 U.S. states</a></li>
          <li><a href="?m=us&amp;q=capitals&amp;c=all">All 50 state capitals</a></li>
          <li><a href="setup">Make your own map quiz</a></li>
          <li><a href="about">About</a></li>
        </ul>
      </noscript></div></div>
    </div>
  </div>

  <script>I18N.init();</script>
  <script src="vendor/d3.min.js"></script>
  <script src="vendor/d3-composite-projections.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="js/data/countries.js"></script>
  <script src="js/data/country-names.js"></script>
  <script src="js/data/us-states.js"></script>
  <script src="js/data/us-counties.js"></script>
  <script src="js/load-map.js"></script>
  <script src="js/common.js"></script>
  <script src="js/map.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
