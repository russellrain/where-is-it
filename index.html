<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where Is It · The country-finding game</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-4 0 32 32'><path fill='%23e0483e' d='M12 0C5.37 0 0 5.37 0 12c0 8.4 10.2 18.6 11.2 19.6a1.1 1.1 0 0 0 1.6 0C13.8 30.6 24 20.4 24 12 24 5.37 18.63 0 12 0z'/><circle cx='12' cy='12' r='4.6' fill='white'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="game">
    <div class="topbar">
      <div class="prompt">
        <div>
          <div class="label" id="prompt-label"></div>
          <div class="target" id="target"><span class="wordmark" role="img" aria-label="Where Is It"><span class="wm-name">Where Is It<svg class="pin" viewBox="0 0 24 32" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 8.4 10.2 18.6 11.2 19.6a1.1 1.1 0 0 0 1.6 0C13.8 30.6 24 20.4 24 12 24 5.37 18.63 0 12 0z"/><circle cx="12" cy="12" r="4.6"/></svg></span></span></div>
        </div>
        <div class="guesses" id="guesses" title="Guesses left"></div>
      </div>
      <div class="stats">
        <div class="stat"><b id="stat-progress">–</b><small>Country</small></div>
        <div class="stat"><b id="stat-score">0</b><small>Correct</small></div>
        <div class="stat"><b id="stat-time">0:00</b><small>Time</small></div>
      </div>
    </div>
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="map-wrap" id="map">
      <div class="feedback" id="feedback" hidden></div>
      <div class="zoom-controls">
        <button type="button" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button type="button" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <button type="button" id="zoom-reset" title="Reset view" aria-label="Reset view">⤢</button>
      </div>
      <div class="attribution">Made by <a href="https://russpuppy.com" target="_blank" rel="noopener">russpuppy</a> · Map: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a></div>
      <button type="button" class="btn primary show-results" id="show-results" hidden>Show results</button>
      <div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>
    </div>
  </div>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="js/data/world.js"></script>
  <script src="js/data/countries.js"></script>
  <script src="js/common.js"></script>
  <script src="js/map.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
